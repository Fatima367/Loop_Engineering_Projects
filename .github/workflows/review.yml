name: pr-review-script

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Run tests and analyze
        run: |
          # Install pytest
          pip install pytest

          # Run tests and capture output
          python -m pytest -v > /tmp/test_output.txt 2>&1 || true

          # Analyze results
          PASSED=$(grep -c "passed" /tmp/test_output.txt || true)
          FAILED=$(grep -c "failed" /tmp/test_output.txt || true)
          ERRORS=$(grep -c "error" /tmp/test_output.txt || true)

          # Create review comment
          echo "## Automated PR Review" > /tmp/review.md
          echo "" >> /tmp/review.md

          if [ "$FAILED" -gt 0 ] || [ "$ERRORS" -gt 0 ]; then
            echo "### ❌ Tests Failed" >> /tmp/review.md
            echo "" >> /tmp/review.md
            echo "**Results:** $PASSED passed, $FAILED failed, $ERRORS errors" >> /tmp/review.md
            echo "" >> /tmp/review.md
            echo "### Failed Tests:" >> /tmp/review.md
            echo '```' >> /tmp/review.md
            grep -A 10 "FAILED" /tmp/test_output.txt >> /tmp/review.md || true
            echo '```' >> /tmp/review.md
            echo "" >> /tmp/review.md
            echo "### 💡 Suggestion:" >> /tmp/review.md
            echo "Please fix the failing tests before merging." >> /tmp/review.md
          else
            echo "### ✅ All Tests Passed" >> /tmp/review.md
            echo "" >> /tmp/review.md
            echo "**Results:** $PASSED tests passed" >> /tmp/review.md
            echo "" >> /tmp/review.md
            echo "Great! All tests are passing. This PR looks good to merge." >> /tmp/review.md
          fi

          # Add diff stats
          echo "" >> /tmp/review.md
          echo "### 📈 Diff Stats" >> /tmp/review.md
          echo '```' >> /tmp/review.md
          git diff --stat origin/${{ github.base_ref }}...HEAD >> /tmp/review.md
          echo '```' >> /tmp/review.md

      - name: Post review comment
        run: |
          COMMENT_BODY=$(cat /tmp/review.md)
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -d "$(jq -n --arg body "$COMMENT_BODY" '{body: $body}')"
          echo "Review posted successfully!"
