name: pr-review-script

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests and capture results
        id: tests
        run: |
          # Find all test files
          TEST_FILES=$(find . -name "test_*.py" -type f)

          if [ -z "$TEST_FILES" ]; then
            echo "## Automated PR Review" > /tmp/review.md
            echo "" >> /tmp/review.md
            echo "### ⚠️ No tests found" >> /tmp/review.md
            echo "**Warning:** No test files found in this PR" >> /tmp/review.md
          else
            # Run tests and capture output
            echo "Running tests..." >> /tmp/test_output.txt
            python -m pytest $TEST_FILES -v >> /tmp/test_output.txt 2>&1
            TEST_EXIT_CODE=$?

            # Create review comment
            echo "## Automated PR Review" > /tmp/review.md
            echo "" >> /tmp/review.md

            if [ $TEST_EXIT_CODE -eq 0 ]; then
              echo "### ✅ All tests passed" >> /tmp/review.md
              echo "" >> /tmp/review.md
              echo "All tests in this PR are passing!" >> /tmp/review.md
            else
              echo "### ❌ Tests failed" >> /tmp/review.md
              echo "" >> /tmp/review.md
              echo "Some tests failed. Here are the results:" >> /tmp/review.md
              echo "" >> /tmp/review.md
              echo '```' >> /tmp/review.md
              cat /tmp/test_output.txt >> /tmp/review.md
              echo '```' >> /tmp/review.md
            fi
          fi

          # Add diff stats
          echo "" >> /tmp/review.md
          echo "### 📈 Diff Stats" >> /tmp/review.md
          echo '```' >> /tmp/review.md
          git diff --stat origin/${{ github.base_ref }}...HEAD >> /tmp/review.md
          echo '```' >> /tmp/review.md

      - name: Post review comment
        run: |
          COMMENT_BODY=$(cat /tmp/review.md)

          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -d "$(jq -n --arg body "$COMMENT_BODY" '{body: $body}')"

          echo "Review posted successfully!"
