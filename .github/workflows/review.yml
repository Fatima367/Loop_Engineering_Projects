name: pr-review-script

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Run tests
        id: run_tests
        run: |
          pip install pytest
          python -m pytest -v 2>&1 | tee /tmp/test_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Create review comment
        run: |
          # Read test output
          TEST_OUTPUT=$(cat /tmp/test_output.txt)

          # Create review
          echo "## Automated PR Review" > /tmp/review.md
          echo "" >> /tmp/review.md

          if [ "${{ steps.run_tests.outputs.exit_code }}" -eq 0 ]; then
            echo "### ✅ All Tests Passed" >> /tmp/review.md
            echo "" >> /tmp/review.md
            echo "All tests are passing. This PR looks good!" >> /tmp/review.md
          else
            echo "### ❌ Tests Failed" >> /tmp/review.md
            echo "" >> /tmp/review.md

            # Extract failed test names
            echo "### 🐛 Failed Tests:" >> /tmp/review.md
            echo "" >> /tmp/review.md
            grep "FAILED" /tmp/test_output.txt | sed 's/.*FAILED //' | sed 's/ -.*//' | while read test; do
              echo "- \`$test\`" >> /tmp/review.md
            done
            echo "" >> /tmp/review.md

            # Show error details
            echo "### 📋 Error Details:" >> /tmp/review.md
            echo '```' >> /tmp/review.md
            grep -A 10 "AssertionError\|ERROR\|assert" /tmp/test_output.txt >> /tmp/review.md || true
            echo '```' >> /tmp/review.md
            echo "" >> /tmp/review.md

            echo "### 💡 Action Required" >> /tmp/review.md
            echo "Please fix the failing tests before merging." >> /tmp/review.md
          fi

          # Add diff stats
          echo "" >> /tmp/review.md
          echo "### 📈 Diff Stats" >> /tmp/review.md
          echo '```' >> /tmp/review.md
          git diff --stat origin/${{ github.base_ref }}...HEAD >> /tmp/review.md
          echo '```' >> /tmp/review.md

      - name: Post review comment
        run: |
          COMMENT_BODY=$(cat /tmp/review.md)
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -d "$(jq -n --arg body "$COMMENT_BODY" '{body: $body}')"
          echo "Review posted successfully!"
