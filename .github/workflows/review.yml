name: pr-review-script

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run review script
        run: |
          # Get the PR diff
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD)

          # Initialize review
          REVIEW="## Automated PR Review\n\n"
          ISSUES_FOUND=0

          # Check for the specific off-by-one bug
          if echo "$DIFF" | grep -q "sum(items\[1:\])"; then
            REVIEW+="### 🐛 Bug Found: Off-by-one error\n"
            REVIEW+="**Issue:** Using \`items[1:]\` skips the first item\n"
            REVIEW+="**Fix:** Use \`items\` instead of \`items[1:]\`\n\n"
            ISSUES_FOUND=$((ISSUES_FOUND + 1))
          fi

          # Check for other common issues
          if echo "$DIFF" | grep -q "eval\|exec"; then
            REVIEW+="### ⚠️ Security Warning\n"
            REVIEW+="**Issue:** Code contains eval/exec\n\n"
            ISSUES_FOUND=$((ISSUES_FOUND + 1))
          fi

          # Summary
          if [ $ISSUES_FOUND -eq 0 ]; then
            REVIEW+="### ✅ No issues found\n"
          else
            REVIEW+="### 📊 Found $ISSUES_FOUND issue(s)\n"
          fi

          # Add diff stats
          REVIEW+="\n### 📈 Diff Stats\n\`\`\`\n"
          REVIEW+=$(git diff --stat origin/${{ github.base_ref }}...HEAD)
          REVIEW+="\n\`\`\`"

          # Post comment using GitHub API
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -d "$(jq -n --arg body "$REVIEW" '{body: $body}')"

          echo "Review posted successfully!"
