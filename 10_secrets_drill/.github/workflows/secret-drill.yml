# secret-drill.yml
# A standalone script — no Claude, no Anthropic keys required.
# Demonstrates the secrets drill: fail without the secret, succeed with it.

name: Secrets Drill

on:
  workflow_dispatch:
    inputs:
      run:
        description: "Which run? 'fail' or 'pass'"
        required: true
        default: "fail"
        type: choice
        options:
          - fail
          - pass

jobs:
  drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run 1 — fails without the secret
        if: inputs.run == 'fail'
        run: |
          echo "=== Run 1: No environment variable set ==="
          echo ""
          if [ -z "$DUMMY_API_TOKEN" ]; then
            echo "DUMMY_API_TOKEN is NOT set."
            echo "Claude cannot find the value — the .env file was gitignored and never reached this clone."
            echo ""
            echo "RESULT: FAIL (as expected)"
            exit 1
          else
            echo "DUMMY_API_TOKEN is set: ${DUMMY_API_TOKEN:0:3}..."
            echo ""
            echo "RESULT: UNEXPECTED PASS — the secret should not be available in this run."
            exit 1
          fi

      - name: Run 2 — passes with the secret
        if: inputs.run == 'pass'
        env:
          DUMMY_API_TOKEN: ${{ secrets.DUMMY_API_TOKEN }}
        run: |
          echo "=== Run 2: Environment variable set via repo secret ==="
          echo ""
          if [ -z "$DUMMY_API_TOKEN" ]; then
            echo "DUMMY_API_TOKEN is NOT set."
            echo ""
            echo "RESULT: FAIL — add DUMMY_API_TOKEN in repo Settings > Secrets and variables > Actions."
            exit 1
          else
            echo "DUMMY_API_TOKEN is set: ${DUMMY_API_TOKEN:0:3}..."
            echo ""
            echo "RESULT: PASS — Claude can now read the token from the environment."
          fi
